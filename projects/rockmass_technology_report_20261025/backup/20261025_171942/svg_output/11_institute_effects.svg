<g id="title" data-pptx-bounds="56 40 1168 94"><text x="56" y="61" font-size="14" fill="#5CB8FF">04 / 应用评价与下一步</text><text x="56" y="114" font-size="42" font-weight="bold" fill="#EAF2FA">应用效果：设计院侧评价口径</text></g>
<g id="efficiency" data-pptx-bounds="56 166 1168 136"><text x="56" y="201" font-size="28" font-weight="bold" fill="#5CB8FF">01 工时</text><text x="300" y="201" font-size="28" font-weight="bold" fill="#EAF2FA">单点计算与计算书编制</text><text x="300" y="246" font-size="24" fill="#EAF2FA">用同一批点位对比人工与软件耗时，单位为分钟/点位。</text><text x="300" y="282" font-size="18" fill="#A8BDD3">预期减少重复查表与誊录；降幅以试点实测为准。</text><line x1="56" y1="302" x2="1224" y2="302" stroke="#284158"/></g>
<g id="reviewability" data-pptx-bounds="56 332 1168 136"><text x="56" y="367" font-size="28" font-weight="bold" fill="#5CB8FF">02 复核</text><text x="300" y="367" font-size="28" font-weight="bold" fill="#EAF2FA">参数依据完整率</text><text x="300" y="412" font-size="24" fill="#EAF2FA">检查输入、采用值、方法及工程条件是否可对应查询。</text><text x="300" y="448" font-size="18" fill="#A8BDD3">口径：依据齐全点位数 / 抽检点位数；审签与不可变留痕仍需完善。</text><line x1="56" y1="468" x2="1224" y2="468" stroke="#284158"/></g>
<g id="knowledge" data-pptx-bounds="56 498 1168 136"><text x="56" y="533" font-size="28" font-weight="bold" fill="#5CB8FF">03 知识</text><text x="300" y="533" font-size="28" font-weight="bold" fill="#EAF2FA">专家经验的审核与复用</text><text x="300" y="578" font-size="24" fill="#EAF2FA">把经验条目与适用条件整理成可维护的院内资料。</text><text x="300" y="614" font-size="18" fill="#A8BDD3">口径：经专家审核条目数、版本与引用记录；知识库质量待专项验证。</text></g>
<text id="footer" data-pptx-role="footer" x="56" y="679" font-size="14" fill="#F5BD65">本页为试点评价方案，尚无院内真实工程工时基线，不将预期效果表述为已实测收益</text><text id="page" data-pptx-role="page-number" x="1200" y="679" font-family="Arial" font-size="14" fill="#A8BDD3">11</text>
