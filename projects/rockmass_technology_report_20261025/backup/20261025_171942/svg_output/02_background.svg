<g id="title" data-pptx-bounds="56 40 1168 94"><text x="56" y="61" font-size="14" fill="#5CB8FF">01 / 需求与总体方案</text><text x="56" y="114" font-size="42" font-weight="bold" fill="#EAF2FA">项目背景与工程需求</text></g>
<g id="standard" data-pptx-bounds="56 168 560 454"><rect x="56" y="168" width="560" height="454" fill="#11263E" /><text x="84" y="214" font-size="18" fill="#5CB8FF">规范依据</text><text x="84" y="263" font-size="28" font-weight="bold" fill="#EAF2FA">GB/T 50218—2014</text><text x="84" y="305" font-size="24" fill="#EAF2FA">《工程岩体分级标准》</text><line x1="84" y1="336" x2="584" y2="336" stroke="#284158" /><text x="84" y="381" font-size="28" fill="#49E0D0"><tspan x="84">“本标准适用于各类型岩石</tspan><tspan x="84" dy="44">工程的岩体分级。”</tspan></text><text x="84" y="473" font-size="18" fill="#A8BDD3">第1.0.2条</text><text x="84" y="529" font-size="24" fill="#EAF2FA"><tspan x="84">先确定基本质量，再结合工况定级。</tspan><tspan x="84" dy="38">分级计算需要保留判断依据。</tspan></text></g>
<g id="workflow-need" data-pptx-bounds="660 168 564 272" fill="#EAF2FA"><text x="660" y="212" font-size="28" font-weight="bold">计算与编书环节</text><text x="660" y="265" font-size="24"><tspan x="660">查表取值、公式计算、结果誊录</tspan><tspan x="660" dy="38">和计算书编制涉及重复操作。</tspan><tspan x="660" dy="54">软件将规则、输入和结果组织在</tspan><tspan x="660" dy="38">同一工作流中，减少信息转抄。</tspan></text></g>
<g id="review-need" data-pptx-bounds="660 462 564 160"><line x1="660" y1="463" x2="1224" y2="463" stroke="#284158" /><text x="660" y="508" font-size="28" font-weight="bold" fill="#EAF2FA">复核与归档需求</text><text x="660" y="556" font-size="24" fill="#EAF2FA"><tspan x="660">工程与点位关联，便于复核采用值。</tspan><tspan x="660" dy="38">院内工作量与耗时基线待试点采集。</tspan></text></g>
