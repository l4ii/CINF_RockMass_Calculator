<text x="81" y="292" font-size="18" fill="#5CB8FF">01 图像采集</text><text x="81" y="345" font-size="24" fill="#EAF2FA"><tspan x="81">掌子面 / 岩芯</tspan><tspan x="81" dy="36">尺度与质量控制</tspan></text><text x="386" y="292" font-size="18" fill="#5CB8FF">02 特征识别</text><text x="386" y="345" font-size="24" fill="#EAF2FA"><tspan x="386">结构面与岩块</tspan><tspan x="386" dy="36">输出可核查标记</tspan></text><text x="691" y="292" font-size="18" fill="#5CB8FF">03 候选值建议</text><text x="691" y="345" font-size="24" fill="#EAF2FA"><tspan x="691">给出候选范围</tspan><tspan x="691" dy="36">保留图像来源</tspan></text><text x="996" y="292" font-size="18" fill="#49E0D0">04 工程师确认</text><text x="996" y="345" font-size="24" fill="#EAF2FA"><tspan x="996">依据现场条件</tspan><tspan x="996" dy="36">决定是否采用</tspan></text></g>
