<g id="engineering-value" data-pptx-bounds="56 166 558 310"><text x="56" y="201" font-size="28" font-weight="bold" fill="#49E0D0">工程侧</text><text font-size="24" fill="#EAF2FA" x="56" y="254">保留点位、参数与采用口径，支持复核。</text><text font-size="24" fill="#EAF2FA" x="56" y="306">多方法交叉核查，差异交由工程师分析。</text><text font-size="24" fill="#EAF2FA" x="56" y="358">成果可支撑设计审查，但不能替代</text><text font-size="24" fill="#EAF2FA" x="56" y="396">专项论证、审签与责任管理制度。</text></g>
<g id="deployment" data-pptx-bounds="660 166 564 310"><text x="660" y="201" font-size="28" font-weight="bold" fill="#5CB8FF">产品化与适用范围</text><text font-size="24" fill="#EAF2FA" x="660" y="254">Windows安装包 + 设备绑定离线授权</text><text font-size="24" fill="#EAF2FA" x="660" y="306">矿山、隧道与边坡按方法适用条件选用。</text><text font-size="24" fill="#EAF2FA" x="660" y="358">旧系统、模型、知识条目和报告格式</text><text font-size="24" fill="#EAF2FA" x="660" y="396">纳入版本验收后，再组织工程推广。</text></g>
