<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial"><rect x="0" y="0" width="1280" height="720" fill="#07182B" /><g id="title" data-pptx-bounds="56 36 1168 104" text-anchor="start"><text x="56" y="58" font-size="14" fill="#5CB8FF" font-weight="normal">01 / 项目背景及思路</text><text x="56" y="111" font-size="42" fill="#EAF2FA" font-weight="bold">解决思路：把岩体分级做成一条工作流</text></g><text x="56" y="680" font-size="14" fill="#A8BDD3" font-weight="normal" text-anchor="start" /><text x="1200" y="680" font-size="14" fill="#A8BDD3" font-weight="normal" text-anchor="start" font-family="Arial">05</text><text x="56" y="168" font-size="28" fill="#EAF2FA" font-weight="bold" text-anchor="start">软件把工程、点位、参数、规则、依据和成果放进同一个闭环。</text><circle cx="114" cy="312" r="38" fill="#5CB8FF" /><text x="114" y="321" font-size="24" fill="#07182B" font-weight="bold" text-anchor="middle" font-family="Arial">1</text><text x="114" y="388" font-size="23" fill="#EAF2FA" font-weight="bold" text-anchor="middle">工程 / 点位</text><line x1="152" y1="312" x2="264" y2="312" stroke="#5CB8FF" stroke-width="4" /><circle cx="358" cy="312" r="38" fill="#49E0D0" /><text x="358" y="321" font-size="24" fill="#07182B" font-weight="bold" text-anchor="middle" font-family="Arial">2</text><text x="358" y="388" font-size="23" fill="#EAF2FA" font-weight="bold" text-anchor="middle">参数录入</text><line x1="396" y1="312" x2="508" y2="312" stroke="#49E0D0" stroke-width="4" /><circle cx="602" cy="312" r="38" fill="#FDD71E" /><text x="602" y="321" font-size="24" fill="#07182B" font-weight="bold" text-anchor="middle" font-family="Arial">3</text><text x="602" y="388" font-size="23" fill="#EAF2FA" font-weight="bold" text-anchor="middle">六方法计算</text><line x1="640" y1="312" x2="752" y2="312" stroke="#FDD71E" stroke-width="4" /><circle cx="846" cy="312" r="38" fill="#FC5F08" /><text x="846" y="321" font-size="24" fill="#07182B" font-weight="bold" text-anchor="middle" font-family="Arial">4</text><text x="846" y="388" font-size="23" fill="#EAF2FA" font-weight="bold" text-anchor="middle">依据留痕</text><line x1="884" y1="312" x2="996" y2="312" stroke="#FC5F08" stroke-width="4" /><circle cx="1090" cy="312" r="38" fill="#5CB8FF" /><text x="1090" y="321" font-size="24" fill="#07182B" font-weight="bold" text-anchor="middle" font-family="Arial">5</text><text x="1090" y="388" font-size="23" fill="#EAF2FA" font-weight="bold" text-anchor="middle">报告输出</text><rect x="56" y="450" width="724" height="142" fill="#11263E" stroke="#284158" stroke-width="1" rx="5" /><text x="82" y="492" font-size="22" fill="#49E0D0" font-weight="bold" text-anchor="start">工程师最终得到</text><text x="82" y="536" font-size="24" fill="#EAF2FA" font-weight="normal" text-anchor="start">可计算的参数</text><text x="82" y="570" font-size="24" fill="#EAF2FA" font-weight="normal" text-anchor="start">可回看的依据</text><text x="82" y="604" font-size="24" fill="#EAF2FA" font-weight="normal" text-anchor="start">可交付的计算书</text><rect x="820" y="450" width="404" height="142" fill="#173F56" rx="5" /><text x="848" y="492" font-size="24" fill="#FDD71E" font-weight="bold" text-anchor="start">本地经验知识助手</text><text x="848" y="536" font-size="20" fill="#EAF2FA" font-weight="normal" text-anchor="start">解释方法选择、参数含义</text><text x="848" y="566" font-size="20" fill="#EAF2FA" font-weight="normal" text-anchor="start">和取值依据；最终采用值</text><text x="848" y="596" font-size="20" fill="#EAF2FA" font-weight="normal" text-anchor="start">仍由工程师确认</text></svg>
