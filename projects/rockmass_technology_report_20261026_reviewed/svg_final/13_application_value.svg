<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial"><rect x="0" y="0" width="1280" height="720" fill="#07182B" /><g id="title" data-pptx-bounds="56 36 1168 104" text-anchor="start"><text x="56" y="58" font-size="14" fill="#5CB8FF" font-weight="normal">03 / 应用及经济社会效益</text><text x="56" y="111" font-size="42" fill="#EAF2FA" font-weight="bold">应用价值与推广路径</text></g><text x="56" y="680" font-size="14" fill="#A8BDD3" font-weight="normal" text-anchor="start" /><text x="1200" y="680" font-size="14" fill="#A8BDD3" font-weight="normal" text-anchor="start" font-family="Arial">13</text><rect x="56" y="180" width="520" height="106" fill="#11263E" stroke="#5CB8FF" stroke-width="2" rx="5" /><text x="82" y="220" font-size="23" fill="#5CB8FF" font-weight="bold" text-anchor="start">计算与编书</text><text x="240" y="220" font-size="20" fill="#EAF2FA" font-weight="normal" text-anchor="start">把查表、计算、整理和交付放进同一流程</text><line x1="82" y1="248" x2="540" y2="248" stroke="#284158" stroke-width="1" /><rect x="56" y="302" width="520" height="106" fill="#11263E" stroke="#49E0D0" stroke-width="2" rx="5" /><text x="82" y="342" font-size="23" fill="#49E0D0" font-weight="bold" text-anchor="start">复核依据</text><text x="240" y="342" font-size="20" fill="#EAF2FA" font-weight="normal" text-anchor="start">工程、点位、原始输入与采用值可对应查询</text><line x1="82" y1="370" x2="540" y2="370" stroke="#284158" stroke-width="1" /><rect x="56" y="424" width="520" height="106" fill="#11263E" stroke="#FDD71E" stroke-width="2" rx="5" /><text x="82" y="464" font-size="23" fill="#FDD71E" font-weight="bold" text-anchor="start">经验沉淀</text><text x="240" y="464" font-size="20" fill="#EAF2FA" font-weight="normal" text-anchor="start">把专家审核过的取值依据整理成院内资料</text><line x1="82" y1="492" x2="540" y2="492" stroke="#284158" stroke-width="1" /><text x="700" y="180" font-size="23" fill="#FC5F08" font-weight="bold" text-anchor="start">推广路径（建议）</text><circle 