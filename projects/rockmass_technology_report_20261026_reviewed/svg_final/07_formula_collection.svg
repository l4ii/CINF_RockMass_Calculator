="210" fill="#11263E" stroke="#284158" stroke-width="1" rx="5" /><text x="84" y="374" font-size="24" fill="#49E0D0" font-weight="bold" text-anchor="start">统一工作入口</text><text x="84" y="420" font-size="24" fill="#EAF2FA" font-weight="bold" text-anchor="start">工程 / 点位 / 参数输入</text><line x1="316" y1="407" x2="418" y2="407" stroke="#5CB8FF" stroke-width="3" /><text x="448" y="374" font-size="24" fill="#FDD71E" font-weight="bold" text-anchor="start">方法专用规则</text><text x="448" y="420" font-size="22" fill="#EAF2FA" font-weight="normal" text-anchor="start">评分表、边界条件、</text><text x="448" y="454" font-size="22" fill="#EAF2FA" font-weight="normal" text-anchor="start">适用限制和结果描述</text><line x1="704" y1="407" x2="806" y2="407" stroke="#5CB8FF" stroke-width="3" /><text x="836" y="374" font-size="24" fill="#FC5F08" font-weight="bold" text-anchor="start">结果与交付</text><text x="836" y="420" font-size="22" fill="#EAF2FA" font-weight="normal" text-anchor="start">结果解释、依据记录、</text><text x="836" y="454" font-size="22" fill="#EAF2FA" font-weight="normal" text-anchor="start">计算书输出</text><text x="56" y="600" font-size="18" fill="#A8BDD3" font-weight="normal" text-anchor="start">已实现基础：六类方法入口与专用计算规则；当前重点是统一工作流，避免重复翻表和重复录入。</text></svg>
