<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial"><rect x="0" y="0" width="1280" height="720" fill="#07182B" /><g id="title" data-pptx-bounds="56 36 1168 104" text-anchor="start"><text x="56" y="58" font-size="14" fill="#5CB8FF" font-weight="normal">01 / 项目背景及思路</text><text x="56" y="111" font-size="42" fill="#EAF2FA" font-weight="bold">工作量大，难点在于反复计算与复核</text></g><text x="56" y="680" font-size="14" fill="#A8BDD3" font-weight="normal" text-anchor="start" /><text x="1200" y="680" font-size="14" fill="#A8BDD3" font-weight="normal" text-anchor="start" font-family="Arial">04</text><text x="56" y="160" font-size="22" fill="#FDD71E" font-weight="bold" text-anchor="start">以西藏金龙等矿山项目的典型工作场景为例</text><rect x="56" y="220" width="198" height="74" fill="#11263E" stroke="#5CB8FF" stroke-width="2" rx="5" /><text x="76" y="265" font-size="23" fill="#EAF2FA" font-weight="bold" text-anchor="start">现场资料</text><line x1="254" y1="257" x2="278" y2="257" stroke="#5CB8FF" stroke-width="3" /><rect x="290" y="220" width="198" height="74" fill="#11263E" stroke="#49E0D0" stroke-width="2" rx="5" /><text x="310" y="265" font-size="23" fill="#EAF2FA" font-weight="bold" text-anchor="start">翻规范取值</text><line x1="488" y1="257" x2="512" y2="257" stroke="#49E0D0" stroke-width="3" /><rect x="524" y="220" width="198" height="74" fill="#11263E" stroke="#FDD71E" stroke-width="2" rx="5" /><text x="544" y="265" font-size="23" fill="#EAF2FA" font-weight="bold" text-anchor="start">多公式计算</text><line x1="722" y1="257" x2="746" y2="257" stroke="#FDD71E" stroke-width="3" /><rect x="758" y="220" width="198" height="74" fill="#11263E" stroke="#FC5F08" stroke-width="2" rx="5" /><text x="778" y="265" font-size="23" fill="#EAF2FA" font-weight="bold" text-anchor="start">自制Excel</text><line x1="956" y1="257" x2="980" y2="257" stroke="#FC5F08" stroke-width="3" /><rect x="992" y="220" width="198" height="74" fill="#11263E" stroke="#5CB8FF" stroke-width="2" rx="5" /><text x="1012" y="265" font-size="23" fill="#EAF2FA" font-weight="bold" text-anchor="start">编制计算书</text><rect x="56" y="360" width="250" height="170" fill="#11263E" stroke="#284158" stroke-width="1" rx="5" /><rect x="56" y="360" width="250" height="8" fill="#5CB8FF" /><text x="76" y="408" font-size="26" fill="#5CB8FF" font-weight="bold" text-anchor="start">点位多</text><text x="76" y="450" font-size="20" fill="#EAF2FA" font-weight="normal" text-anchor="start">同一工程要反复处理多个部</text><text x="76" y="481" font-size="20" fill="#EAF2FA" font-weight="normal" text-anchor="start">位、多个点位</text><rect x="350" y="360" width="250" height="170" fill="#11263E" stroke="#284158" stroke-width="1" rx="5" /><rect x="350" y="360" width="250" height="8" fill="#49E0D0" /><text x="370" y="408" font-size="26" fill="#49E0D0" font-weight="bold" text-anchor="start">公式多</text><text x="370" y="450" font-size="20" fill="#EAF2FA" font-weight="normal" text-anchor="start">RQD、BQ、Q、RMR</text><text x="370" y="481" font-size="20" fill="#EAF2FA" font-weight="normal" text-anchor="start">等方法并行计算</text><rect x="644" y="360" width="250" height="170" fill="#11263E" stroke="#284158" stroke-width="1" rx="5" /><rect x="644" y="360" width="250" height="8" fill="#FDD71E" /><text x="664" y="408" font-size="26" fill="#FDD71E" font-weight="bold" text-anchor="start">判断主观</text><text x="664" y="450" font-size="20" fill="#EAF2FA" font-weight="normal" text-anchor="start">参数取值、采用口径需要工</text><text x="664" y="481" font-size="20" fill="#EAF2FA" font-weight="normal" text-anchor="start">程经验</text><rect x="938" y="360" width="250" height="170" fill="#11263E" stroke="#284158" stroke-width="1" rx="5" /><rect x="938" y="360" width="250" height="8" fill="#FC5F08" /><text x="958" y="408" font-size="26" fill="#FC5F08" font-weight="bold" text-anchor="start">复核困难</text><text x="958" y="450" font-size="20" fill="#EAF2FA" font-weight="normal" text-anchor="start">很难快速回到某个结果的依</text><text x="958" y="481" font-size="20" fill="#EAF2FA" font-weight="normal" text-anchor="start">据和过程</text><rect x="56" y="580" width="1168" height="48" fill="#173F56" rx="4" /><text x="78" y="612" font-size="22" fill="#EAF2FA" font-weight="bold" text-anchor="start">问题落点：查表、计算、记录、编书和复核分散在多个工具里，信息容易重复转抄。</text></svg>
